# flutter-ics-homescreen on a Raspberry Pi — the board layer of this app.
#
# The app adds nothing board-specific. Toolchain, sysroot image, partition, cpu
# tuning and the GUI/input/Vulkan stack come from ivi-homescreen's own Pi
# targets, which extend emb's shipped board library; the plugin set in
# base.emb.yaml is the whole of this app's layer and applies to every target
# here.
#
# The names are still spelled out, one key per board, because emb applies an
# app layer only for a target the app itself declares. A missing name is not an
# error — it silently builds the embedder with the project's own defines, which
# means DISABLE_PLUGINS=ON and no Rive text at runtime.
#
#   emb cross ../ivi-homescreen --list-targets
#
#   emb cross ../ivi-homescreen --target rpi5-trixie --build --no-verify \
#       --backend drm-kms-egl --app ../flutter-ics-homescreen --mode release \
#       --tar --deploy pi@raspberrypi.local --run
#
# Backends per board come from the embedder project: rpi5 offers all five
# (wayland-egl, wayland-vulkan, drm-kms-egl, drm-kms-vulkan, software), rpi4
# and the Zero 2 W the four without drm-kms-vulkan. Pick one with --backend:
# drm-kms-egl for a bare-metal console boot, wayland-egl under a compositor.
#
# bookworm and trixie are separate targets because they are separate sysroots
# (gcc 12 / glibc 2.36 vs gcc 15 / glibc 2.41); a bundle built against one does
# not run on the other.
#
# "Pi Zero" here is the Zero 2 W (Cortex-A53, arm64). The original Zero / Zero W
# is armv6, which has no Flutter engine — there is no target for it.
id: flutter-ics-homescreen
type: app
supported_archs: [arm64]
supported_host_types: [fedora, ubuntu]

cross:
  targets:
    # Cortex-A76.
    rpi5-trixie: {}
    rpi5-bookworm: {}

    # Cortex-A72.
    rpi4-trixie: {}
    rpi4-bookworm: {}

    # Cortex-A53. 512 MB of RAM: build --mode release, not profile or debug.
    rpi-zero-2w-trixie: {}
    rpi-zero-2w-bookworm: {}
