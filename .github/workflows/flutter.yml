name: Flutter checks
on:
  push:
  pull_request:
jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake ninja-build pkg-config libsystemd-dev libgtk-3-dev liblzma-dev libstdc++-14-dev
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.38.3 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      # Keep existing style/deprecation infos visible; fail on every error/warning.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
